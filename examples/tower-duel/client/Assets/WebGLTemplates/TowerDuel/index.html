<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff2d8">
  <title>雙塔對決 · Tower Duel</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8cda7;color:#26334e;font:16px system-ui,sans-serif}
    #game{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    #unity-canvas{display:block;width:100%;height:100%;min-width:0;min-height:0;outline:none;background:#fff2d8;touch-action:none}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:#fff2d8;padding:30px;text-align:center}
    h1{font-size:36px;margin:0}p{margin:0;line-height:1.7;color:#554638}progress{width:min(320px,80vw);height:14px;accent-color:#ad641e}
    #error{display:none;white-space:pre-wrap;max-width:580px;color:#8e2b23}
  </style>
</head>
<body>
  <main id="game"><canvas id="unity-canvas" width="720" height="1000" tabindex="0" aria-label="雙塔對決遊戲"></canvas></main>
  <div id="loading" role="status"><h1>雙塔對決</h1><p id="status">載入戰場中…</p><progress id="progress" max="1" value="0"></progress><div id="error"></div></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas=document.getElementById('unity-canvas');
    function failed(message){
      document.getElementById('loading').style.display='flex';
      document.getElementById('status').textContent='遊戲載入失敗';
      const error=document.getElementById('error');error.style.display='block';
      error.textContent='請使用支援 WebGL 2 的新版 Chrome、Edge 或 Safari，或重新整理再試。\n'+String(message);
      document.getElementById('progress').hidden=true;
    }
    // Only content-addressed same-origin assets can skip Unity's IndexedDB revalidation.
    // The local /Build files retain the safe revalidation policy.
    function towerDuelCacheControl(url) {
      const asset = new URL(url, window.location.href);
      if (asset.origin === window.location.origin &&
          /^\/assets\/core\/[0-9a-f]{64}\/WebGL\.(loader\.js|framework\.js\.gz|data\.gz|wasm\.gz)$/.test(asset.pathname)) return 'immutable';
      if (/\.data(?:\.gz)?$|\.bundle$/.test(asset.pathname)) return 'must-revalidate';
      return 'no-store';
    }
    createUnityInstance(canvas,{
      dataUrl:'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl:'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl:'StreamingAssets',
      cacheControl: towerDuelCacheControl,
      companyName:{{{ JSON.stringify(COMPANY_NAME) }}},
      productName:{{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),
      showBanner:(message,type)=>{if(type==='error')failed(message);else console.warn(message);}
    },progress=>{document.getElementById('progress').value=progress;document.getElementById('status').textContent=progress<.9?'載入戰場中… '+Math.round(progress*100)+'%':'準備進入戰場…';})
    .then(instance=>{window.towerDuel=instance;document.getElementById('loading').style.display='none';canvas.focus();})
    .catch(failed);
  </script>
</body>
</html>
