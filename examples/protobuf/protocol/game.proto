syntax = "proto3";

package gamenetkit.example.v1;
option csharp_namespace = "GameNetKit.ProtobufExample";
option go_package = "github.com/win30221/gamenetkit/examples/protobuf/server/gen";

message Hello { uint32 protocol_version = 1; string name = 2; }
message Welcome { uint32 protocol_version = 1; uint64 player_id = 2; }
message MoveInput { uint64 sequence = 1; float x = 2; float z = 3; }
message Player { uint64 id = 1; float x = 2; float z = 3; uint64 ack = 4; }
message WorldSnapshot { uint64 tick = 1; repeated Player players = 2; }
message ProtocolError { string code = 1; }
message ClientPacket {
  oneof body { Hello hello = 1; MoveInput move = 10; }
}
message ServerPacket {
  oneof body { Welcome welcome = 1; ProtocolError error = 2; WorldSnapshot snapshot = 10; }
}
// Exercises presence, repeated values and values above JavaScript's exact integer range.
// It is a compatibility fixture, not part of either gameplay envelope.
message CompatibilityProbe {
  optional uint64 optional_value = 1;
  repeated uint64 values = 2;
  oneof body { string text = 3; uint64 number = 4; }
}
